<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solution Finder - Dark Mode</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --text-main: #f1f5f9;
            --text-sub: #94a3b8;
            --border: #334155;
        }

        body {
            margin: 0;
            font-family: 'Pretendard', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Top Navigation Bar */
        header {
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border);
            padding: 1rem 2rem;
            display: flex;
            align-items: center;
            gap: 2rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
            z-index: 10;
        }

        .logo {
            font-weight: 900;
            font-size: 1.2rem;
            color: var(--accent);
            white-space: nowrap;
            margin-right: auto;
        }

        .filter-bar {
            display: flex;
            gap: 1rem;
            flex-grow: 1;
            justify-content: flex-end;
        }

        select {
            background-color: #0f172a;
            color: white;
            border: 1px solid var(--border);
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            font-size: 0.9rem;
            min-width: 200px;
        }
        
        select:focus {
            border-color: var(--accent);
            outline: none;
        }

        /* Main Content */
        main {
            flex: 1;
            padding: 3rem;
            overflow-y: auto;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }

        .empty-state {
            text-align: center;
            color: var(--text-sub);
            margin-top: 10vh;
        }

        /* Result Grid */
        .result-container {
            display: none;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            align-items: start;
        }

        /* Left: Diagnosis */
        .diagnosis-section {
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .highlight-box {
            background: linear-gradient(145deg, var(--card-bg), #162032);
            padding: 2.5rem;
            border-radius: 1rem;
            border: 1px solid var(--border);
        }

        .path {
            color: var(--accent);
            font-size: 0.9rem;
            margin-bottom: 1rem;
            display: block;
            opacity: 0.8;
        }

        .sentence {
            font-size: 2rem;
            font-weight: 700;
            line-height: 1.3;
            margin-bottom: 2rem;
        }

        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .tag {
            background: rgba(56, 189, 248, 0.1);
            color: var(--accent);
            padding: 0.3rem 0.8rem;
            border-radius: 4px;
            font-size: 0.85rem;
            border: 1px solid rgba(56, 189, 248, 0.2);
        }

        .tag.target {
            background: rgba(236, 72, 153, 0.1);
            color: #f472b6;
            border-color: rgba(236, 72, 153, 0.2);
        }

        .insight-box {
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 1px solid var(--border);
        }

        .insight-title {
            color: var(--text-sub);
            font-size: 0.8rem;
            margin-bottom: 0.5rem;
            display: block;
        }

        /* Right: Solutions */
        .solution-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .section-title {
            font-size: 1.2rem;
            margin-bottom: 1rem;
            color: var(--text-sub);
        }

        .sol-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            padding: 1.5rem;
            border-radius: 0.75rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: 0.2s;
        }

        .sol-card:hover {
            border-color: var(--accent);
            transform: translateX(5px);
        }

        .sol-info h3 {
            font-size: 1.1rem;
            margin: 0 0 0.5rem 0;
        }

        .sol-meta {
            font-size: 0.85rem;
            color: var(--text-sub);
        }

        .sol-badge {
            background: var(--bg-color);
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            font-family: monospace;
            font-size: 0.8rem;
            color: var(--accent);
        }

        @media (max-width: 1024px) {
            header { flex-direction: column; align-items: stretch; gap: 1rem; }
            .filter-bar { flex-direction: column; }
            .result-container { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">SOL_FINDER v2.0</div>
        <div class="filter-bar">
            <select id="mainCat"><option value="">1. 대분류 선택</option></select>
            <select id="midCat" disabled><option value="">2. 중분류 선택</option></select>
            <select id="subCat" disabled><option value="">3. 소분류 선택</option></select>
        </div>
    </header>

    <main>
        <div id="emptyState" class="empty-state">
            <h1>Select Filters to Analyze</h1>
            <p>상단 필터를 순서대로 선택하여 진단을 시작하세요.</p>
        </div>

        <div id="resultContainer" class="result-container">
            <!-- Left -->
            <div class="diagnosis-section">
                <div class="highlight-box">
                    <span id="displayPath" class="path">PATH</span>
                    <div id="customerSentence" class="sentence">Sentence</div>
                    
                    <div id="tagsContainer" class="tags">
                        <!-- Tags -->
                    </div>

                    <div class="insight-box">
                        <span class="insight-title">KEY INSIGHT</span>
                        <p id="recommendationText">Text</p>
                    </div>
                </div>
            </div>

            <!-- Right -->
            <div class="solution-section">
                <h2 class="section-title">Recommended Solutions</h2>
                <div id="solutionGrid" class="solution-list">
                    <!-- Cards -->
                </div>
            </div>
        </div>
    </main>

    <!-- Script Injection (Reuse Logic) -->
    <script>
        const solutionDB = {
            '1.1.1.1': { area: '조직개발', method: 'Consulting', category: '조직개발컨설팅', type: '조직진단 및 솔루션 도출' },
            '1.1.1.2': { area: '조직개발', method: 'Consulting', category: '조직개발컨설팅', type: '조직방향 수립 컨설팅' },
            '1.1.1.3': { area: '조직개발', method: 'Workshop', category: '워크숍', type: '비전/가치 내재화 워크숍' },
            '1.2.1.1': { area: '리더십', method: 'Training', category: '팀장리더십', type: '성과관리 코칭 스킬' },
            '1.2.1.2': { area: '리더십', method: 'Training', category: '임원리더십', type: '전략적 의사결정 과정' },
            '2.1.1.1': { area: 'HR제도', method: 'System', category: '평가보상', type: 'KPI 고도화 컨설팅' },
            '2.1.1.2': { area: 'HR제도', method: 'System', category: '채용', type: '채용 브랜딩 전략' }
        };

        const scenarios = [
            { main: 'A. 전략방향->실행', mid: 'A-1. 전략방향 공유', sub: '전략 전달 부재', sentence: '전략과 방향이 현장 언어로 내려오지 않습니다.', tags: ['#전략이안내려옴', '#방향이불분명', '#메세지불일치'], targets: ['#전사', '#임원', '#팀장'], point: '전략 자체의 문제보다는, 이를 현장에 전달하는 "번역"과 "소통 구조"의 부재를 해결해야 합니다.', solutions: ['1.1.1.1', '1.1.1.2', '1.1.1.3'] },
            { main: 'A. 전략방향->실행', mid: 'A-1. 전략방향 공유', sub: '우선순위 기준 부재', sentence: '무엇부터 해야 할지 기준이 없습니다.', tags: ['#우선순위모호', '#일이많음', '#선택이어려움'], targets: ['#임원', '#팀장', '#본부/사업부'], point: '업무 과부하가 아니라 "선택과 집중"을 위한 명확한 의사결정 기준이 부재한 상태입니다.', solutions: ['1.2.1.2', '1.1.1.2'] },
            { main: 'A. 전략방향->실행', mid: 'A-2. 실행력 강화', sub: '실행 동기 부족', sentence: '왜 해야 하는지 공감이 되지 않아 움직이지 않습니다.', tags: ['#동기부여실패', '#수동적태도', '#패배의식'], targets: ['#팀장', '#팀원'], point: 'Top-down 지시가 아닌 구성원의 참여를 통해 실행의 "Why"를 공유해야 합니다.', solutions: ['1.1.1.3'] },
            { main: 'B. 리더십->소통', mid: 'B-1. 성과 관리', sub: '피드백 부재', sentence: '열심히 해도 인정받지 못하고, 무엇을 고쳐야 할지 모릅니다.', tags: ['#피드백없음', '#성장정체', '#불만누적'], targets: ['#팀장', '#파트장'], point: '평가 시점의 통보가 아닌, 상시적인 성과 관리와 육성 관점의 피드백 스킬이 필요합니다.', solutions: ['1.2.1.1'] },
            { main: 'B. 리더십->소통', mid: 'B-2. 조직 문화', sub: '수직적 문화', sentence: '상사 눈치 보느라 자유로운 의견 개진이 어렵습니다.', tags: ['#눈치문화', '#침묵', '#혁신저해'], targets: ['#전사', '#임원'], point: '심리적 안전감을 조성하여 구성원이 두려움 없이 의견을 말할 수 있는 문화를 만들어야 합니다.', solutions: ['1.1.1.1', '1.1.1.3'] }
        ];

        const mainSelect = document.getElementById('mainCat');
        const midSelect = document.getElementById('midCat');
        const subSelect = document.getElementById('subCat');
        const emptyState = document.getElementById('emptyState');
        const resultContainer = document.getElementById('resultContainer');
        const uniqueMainCats = [...new Set(scenarios.map(s => s.main))];
        
        function init() {
            uniqueMainCats.forEach(cat => {
                const option = document.createElement('option');
                option.value = cat;
                option.textContent = cat;
                mainSelect.appendChild(option);
            });
        }

        mainSelect.addEventListener('change', (e) => {
            const selectedMain = e.target.value;
            midSelect.innerHTML = '<option value="">2. 중분류 선택</option>';
            subSelect.innerHTML = '<option value="">3. 소분류 선택</option>';
            subSelect.disabled = true;
            hideResult();
            if (!selectedMain) { midSelect.disabled = true; return; }
            const relatedMids = [...new Set(scenarios.filter(s => s.main === selectedMain).map(s => s.mid))];
            relatedMids.forEach(mid => {
                const option = document.createElement('option'); option.value = mid; option.textContent = mid; midSelect.appendChild(option);
            });
            midSelect.disabled = false;
        });

        midSelect.addEventListener('change', (e) => {
            const selectedMain = mainSelect.value;
            const selectedMid = e.target.value;
            subSelect.innerHTML = '<option value="">3. 소분류 선택</option>';
            hideResult();
            if (!selectedMid) { subSelect.disabled = true; return; }
            const relatedSubs = scenarios.filter(s => s.main === selectedMain && s.mid === selectedMid).map(s => s.sub);
            relatedSubs.forEach(sub => {
                const option = document.createElement('option'); option.value = sub; option.textContent = sub; subSelect.appendChild(option);
            });
            subSelect.disabled = false;
        });

        subSelect.addEventListener('change', (e) => {
            const selectedSub = e.target.value;
            if (!selectedSub) { hideResult(); return; }
            const matchedScenario = scenarios.find(s => s.main === mainSelect.value && s.mid === midSelect.value && s.sub === selectedSub);
            if (matchedScenario) { renderResult(matchedScenario); }
        });

        function hideResult() { emptyState.style.display = 'block'; resultContainer.style.display = 'none'; }

        function renderResult(data) {
            emptyState.style.display = 'none';
            resultContainer.style.display = 'grid';
            document.getElementById('displayPath').textContent = `${data.main} > ${data.mid} > ${data.sub}`;
            document.getElementById('customerSentence').textContent = `"${data.sentence}"`;
            document.getElementById('recommendationText').textContent = data.point;
            
            const tagsContainer = document.getElementById('tagsContainer');
            tagsContainer.innerHTML = '';
            data.tags.forEach(tag => { const span = document.createElement('span'); span.className = 'tag'; span.textContent = tag; tagsContainer.appendChild(span); });
            data.targets.forEach(target => { const span = document.createElement('span'); span.className = 'tag target'; span.textContent = target; tagsContainer.appendChild(span); });

            const solutionGrid = document.getElementById('solutionGrid');
            solutionGrid.innerHTML = '';
            data.solutions.forEach(code => {
                const sol = solutionDB[code];
                if(sol) {
                    const card = document.createElement('div');
                    card.className = 'sol-card';
                    card.innerHTML = `
                        <div class="sol-info">
                            <h3>${sol.type}</h3>
                            <div class="sol-meta">${sol.area} / ${sol.method}</div>
                        </div>
                        <div class="sol-badge">${code}</div>
                    `;
                    solutionGrid.appendChild(card);
                }
            });
        }
        init();
    </script>
</body>
</html>
